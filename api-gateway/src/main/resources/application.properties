spring.application.name=api-gateway
server.port=3434

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Student Service Route
spring.cloud.gateway.server.webmvc.routes[0].id=STUDENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://STUDENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/students/**

# College Service Route
spring.cloud.gateway.server.webmvc.routes[1].id=COLLEGE-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://COLLEGE-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/colleges/**